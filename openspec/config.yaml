# OpenSpec/SDD project context for xfinaudio.
# Generated from repository inspection on 2026-06-06; keep user-maintained changes authoritative.
project:
  name: xfinaudio
  # Repository-relative on purpose. This field used to name a machine-local
  # path belonging to a different, independent clone of this same repository,
  # so anything resolving project.root from this file operated on the wrong
  # tree. The tooling resolves the project root with
  # `git rev-parse --show-toplevel || pwd`; `.` is the only value that keeps
  # that meaning in any clone.
  root: .
  description: Metadata-driven DJ playlist assistant desktop app/discovery prototype.
  language: python
  python:
    requires: ">=3.11"
  application:
    type: desktop
    ui_framework: PySide6
    entrypoint: xfinaudio = xfinaudio.desktop.app:main
  source_roots:
    - src/xfinaudio
  test_roots:
    - tests
  package_manager: uv

stack:
  runtime:
    - Python >=3.11
    - PySide6 >=6.0,<7.0
  core_dependencies:
    - mutagen >=1.47,<2.0
    - pydantic >=2.0,<3.0
    - PySide6 >=6.0,<7.0
    - librosa >=0.10,<0.12
    - numpy >=1.24,<3.0
    - watchdog >=4.0,<7.0
    - setproctitle >=1.3,<2.0
    - pyobjc-framework-Cocoa >=10.0,<13.0 (Darwin only)
  dev_dependencies:
    - pytest >=8.0,<10.0
    - pytest-cov >=7.1.0,<8.0
    - pyright >=1.1.410,<2.0
    - ruff >=0.11,<1.0
    - pyinstaller ==6.20.0

sdd:
  methodology: gentle-ai.sdd-tdd.v1
  artifact_store: openspec
  execution_mode: auto
  strict_tdd: true
  phase_rules:
    - Do not implement changes during SDD initialization.
    - Use proposal, spec, design, tasks, apply, and verify phases for feature/refactor work.
    - In strict TDD, write or update failing tests before implementation during apply.
    - Keep OpenSpec artifacts in this repository's openspec/ tree.
    - Follow the project skill .atl/skills/gentle-ai-sdd-tdd/SKILL.md for the full lifecycle.
  current_intent:
    requested_change: Idle; the spectral colour work is complete and archived.
    status: idle — no active change in this repository.
    reference_history:
      - openspec/changes/archive/2026-06-14-spectral-color-features

testing:
  runner: pytest
  framework: pytest (range pinned in pyproject.toml)
  primary_command: uv run pytest -q
  strict_tdd: true
  test_layers:
    unit: { available: true, tool: pytest }
    integration: { available: true, tool: pytest }
    ui: { available: true, tool: pytest + PySide6 offscreen }
    e2e: { available: true, tool: pytest }
  coverage:
    available: true
    tool: pytest-cov
    command: uv run pytest --cov -q
    floor_owner: pyproject.toml (tool.coverage.report.fail_under)
  type_checker:
    available: true
    tool: pyright
    command: uv run pyright src tests
  validation_commands:
    - uv run pytest -q
    - uv run pyright src tests
    - uv run pytest --cov -q
    - uv run ruff check .
    - uv run ruff format --check .
  pytest:
    testpaths:
      - tests
    pythonpath:
      - src
  linting:
    ruff:
      available: true
      target_version: py311
      line_length: 120
      lint_select:
        - E
        - W
        - F
        - I
        - B
        - C4
        - UP
        - SIM
      format:
        quote_style: double
        indent_style: space
  formatter:
    tool: ruff
    available: true
    command: uv run ruff format .

conventions:
  skill_registry: .atl/skill-registry.md
  review_budget_changed_lines: 400
