notes: |
  Five guards and one publication path, each verified by running the guard rather than by
  reading it. No file under src/xfinaudio changes; the wheel was never affected, because none
  of the excluded scratch lived inside the package.

  Full-suite evidence was measured at 234d6f5 (1896 passed) and the documentation work unit
  landed as 39fbeb5; WU8 re-runs the whole gate over the finished tree and the result is in
  verify-report.md. The two revisions are kept distinct there on purpose.

  Provenance: WU1-WU5 were implemented by the session that produced the orchestration ledger at
  odd/tasks/harden-release-gates.md, which records a RED before each production change. Those RED
  observations are reproduced in apply-progress.md as recorded by that session, not re-observed
  by this one. WU6 and both of its mutation directions were observed directly. No RED output is
  invented for a work unit whose RED nobody present observed.

  review_status is pending, and that is a statement about what happened rather than a formality:
  no independent or native review transaction was opened for these bytes, and this change claims
  no review receipt. Verification here means the local gates and the re-verification of each
  defect.

  Two follow-ups were found while closing this change and are deliberately left unfixed, recorded
  in the ledger and in verify-report.md: a dead conventions.skill_registry pointer to a
  git-ignored file, and a packaging test that reads an active change's artifact and so breaks when
  that change is archived as its own state.yaml prescribes.
