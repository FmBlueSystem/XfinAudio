notes:
  - This change records an evidence-based review of the tree at 3172b4f and the corrections applied to it; it is not an auto-selected SDD phase and carries no native review receipt.
  - 'W1-W8 each followed RED before GREEN: the new or updated guard was observed failing on the pre-fix tree (git stash of the single file, or a temporary probe reverted afterwards) and passing after the fix. The two exceptions are disclosed rather than claimed: W7 removed code whose surface no guard covered until its own test existed, and W8 found no functional RED achievable because the existing core was already correct, so its non-vacuity was proven with a temporary one-line probe instead.'
  - 'Full gate of record: UV_OFFLINE=1 uv run python scripts/release_gate_check.py --run --report-json /tmp/xfinaudio-release-gate-report.json exited 0 with overall_status passed and all nine gates passing, 2822 passed, coverage 91.83% against the 89 floor that lives only in pyproject.toml. This is the final of five runs in the phase; the two earlier green runs reported 2819 passed before the three freezer-lock guards existed, and the last run was required because regenerating a tracked lock invalidates the earlier result. No --cov-fail-under was passed on any command line.'
  - 'Node suite of record: XFIN_PYTHON=<worktree>/.venv/bin/python npm test reported 519 tests, 519 passed, 0 failed, 0 skipped; the pre-change baseline with the same configuration was 515 passed with 0 skipped.'
  - 'Two guard/lint defects were found by the first two gate runs and fixed before the green run: docs/third-party-license-inventory.md named PySide6, which two absolute-ban guards prohibit in that document, so the sentence was reworded to name the Qt desktop and 4e31a3a instead of relaxing the guards; and the new tests/test_sdd_config_matches_project.py carried a 190-character line, wrapped to fit the 120 limit. ruff format also asked for two of the new test files to be reformatted, done before the green run.'
  - 'docs/release-candidate-evidence.md was regenerated from the green report, which removed a stale coverage row advertising --cov-fail-under=70 and a PyInstaller check-only row for a lane deleted in 4e31a3a. Every document and lock consumer of that file was re-run afterwards (70 passed).'
  - 'Desktop launch was observed with env -u ELECTRON_RUN_AS_NODE XFIN_PYTHON=<venv> npm start: Electron 44.5.1 registered as a foreground GUI application, wrote its Chromium profile, and spawned python -m xfinaudio.headless --data-dir "~/Library/Application Support/XfinAudio Next" as a child. No screenshot exists because the harness process lacks screen-recording permission; no UI interaction was automated.'
  - 'The first launch attempt failed with TypeError: Cannot read properties of undefined (reading setName) because this session exports ELECTRON_RUN_AS_NODE=1, which makes the Electron binary run the main script as plain Node. That is a harness artifact, not a repository defect, and is recorded so a future automated launch that inherits the variable is not misread as a broken build.'
  - 'All tasks are checked: the freezer lock was regenerated. An earlier round recorded this as blocked offline, and that conclusion was wrong: uv pip compile --generate-hashes had only been run with UV_OFFLINE=1 in the environment, which is what refused the index. With the variable removed from the process environment the documented compile exits 0 and packaging/linux/requirements-build.txt is now a 37-pin hash-locked export of the current snapshot (packaging 25.0, setproctitle and watchdog present, cloudpickle and macholib absent). The flag --python-platform linux is what keeps the Darwin-only macholib pin in the macOS file. Three new tests in tests/test_headless_requirements_lock_drift.py guard the compiled lock itself (agreement and completeness against the snapshot, every pin hashed, autogenerated header, macOS include); RED for the agreement test was the real stale lock from HEAD (AssertionError: omits headless pins: [setproctitle, watchdog]), and RED for the export test came from a temporary probe that removed two --hash lines.'
  - 'Review-budget plan is written inside the change rather than asserted: design.md D10 carries the measured per-unit table (files, +added, -deleted, whether the unit reviews alone), the totals +2324/-5417 reviewable lines, the exclusion of the two machine-generated lock files (+1312/-1576) and of the 4996 deleted generated .ts catalogs, and a review order that pairs each unit with the question it answers. proposal.md points to D10, which is what makes the over-budget diff permissible.'
  - 'Review items 9-11 were deliberately not changed and are recorded in proposal.md with evidence: 62 changes parked at status verify, oversized modules (playlist_service.py 1651, optimizer.py 1034, track_repository.py 1037), duplicated validation constants (2..80 three times, the 64-hex digest pattern eight times), the copied *-host.ts lifecycle boilerplate, and the zero-caller application/playlist_file_export.py surface. Each needs its own change and its own RED.'
  - 'Native/live validation is not claimed and is the recommended next step: no live AI provider call, no credential, no real Mixed In Key library, and no signed or notarized packaging run were exercised.'
  - 'The corrections are committed locally on feat/ai-playlist-improvement as nine work-unit commits from 3172b4f: 70d6c0a (W1 export containment), bb29fac (W2 renderer hold), 8d18125 (W3 freezer lock and its three guards), ad593f4 (W5 scan-failure logging), 3416410 (W7 Qt-era residue, including the .ts catalog deletions), 7e0b2e3 (W4 documentation freshness guard plus the regenerated gate evidence), 296cf09 (W6 SDD config, skill and state), 95564bd (W8 integration test) and the record commit that adds this directory together with scripts/render_release_gate_evidence.py. Nothing was pushed, tagged or merged; every commit is local and the branch is still 0 behind / 51+ ahead of origin/main. The delivery section is therefore written as a single change rather than a chained PR plan. odd/tasks/ai-playlist-improvement.md stays uncommitted on purpose: its working-tree diff belongs to the earlier I5 cycle, not to this change.'
