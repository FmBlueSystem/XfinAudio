notes:
  - "Root cause (verified against source, not inferred): MIXED is not a spectral region. `_dominant_color()` (audio/spectral_profile.py:177-194) returns MIXED from its `if not eligible:` branch — the ELSE of three threshold tests (RED >= 0.45, GREEN >= 0.48, BLUE >= 0.22). Measured over the r+g+b=1 simplex, the MIXED bucket has an L1 diameter of 0.30 and covers only 2.21% of the simplex, yet holds 44% of the library's E8 tracks (305/691). The provisional bound MIXED_RGB_L1_MAX=0.08 is ~3.75x tighter than the bucket's own diameter, which is why label equality on MIXED constrains nothing."
  - "Second defect: `same_color_energy` composes two filters designed for OTHER strategies — `_apply_color_filter()` (label equality, built for same_color) and `_apply_energy_tolerance(tolerance=1)` (a sequencing-comfort band, built for same_energy). The two loosenesses are independent, so they multiply."
  - "Third defect: `_apply_color_filter()` (playlist_service.py:689-704) returns the UNFILTERED pool at line 703 when nothing matches. In the edge case the strategy offers no guarantee at all. The helper is SHARED with same_color, whose fallback and warning text must remain byte-compatible."
  - "Design gate history: three failed validations, then an authorized FOURTH correction (2026-08-02) that closed the architecture blocker and removed cross-artifact contradictions. design.md had asserted an invocation route the checkout does not have and declared `Open Questions: None` while CONTINUATION.md called the same gap the final known architecture blocker."
  - "Threshold decision (maintainer, 2026-08-02): MIXED numeric bounds are PROVISIONAL pending listening calibration, which cannot run before an implementation exists. The delta spec's MUST attaches to the RULE SHAPE (label equality plus a bounded anchor-relative RGB L1 / centroid / rolloff gate expressed through named constants), NOT to the literal values. Constants: MIXED_RGB_L1_MAX (initial 0.08), MIXED_CENTROID_REL_MAX (0.15), MIXED_ROLLOFF_REL_MAX (0.15)."
  - "Review Workload Forecast: ~558 changed lines total (~268 production, ~290 tests) against a 400-line budget. Over budget; the overage is strict-TDD test volume, not production sprawl. Maintainer chose chained PRs with feature-branch-chain."
  - "Tracker decision (maintainer, 2026-08-02): the inherited branch codex/fix-same-color-energy-semantics was REJECTED as tracker. It carried four unrelated commits (6543208, 787be59, 8e7643e, b71afa2 — VirtualDJ export plus energy shaping, ~1969 lines) absent from origin/main and from every remote branch. Chaining onto it would have merged VirtualDJ work into this change's final PR. Those commits retain their own delivery path on fix/impossible-key-clash-is-unavailable. Clean tracker feat/tighten-same-color-energy created from origin/main."
  - "Portability was verified on two axes before re-anchoring: semantically, the four commits touch playlist_service.py only in the recommend_playlist and _bpm_jump_warning regions — neither characterized function appears in that diff; textually, `git merge-tree --write-tree --merge-base=b71afa2 origin/main ec5947a` returned exit 0 with zero conflict markers."
  - "Slice 1 SHIPPED as PR #332 (test/same-color-energy-characterization -> feat/tighten-same-color-energy), commit 9c692f4. Test-only, zero production behavior changed: 159 test lines pinning the previously-untested +/-1 energy band, the same_color unfiltered fallback (asserted by list identity, emitting two warnings), and verbatim strategy descriptions. All nine assertions passed on their first run against unmodified code — no test was adjusted to fit reality."
  - "Verification re-run on the clean base after re-anchoring (the prior run was invalidated by the base change): pytest 1382 passed, pyright 0 errors, coverage 91.20% (floor 70), ruff check and format clean, release_gate_check exit 0. The 49-test delta versus the contaminated base is exactly the tests the VirtualDJ commits contributed."
  - "Remaining slices: PR 2 — core strict eligibility (exact energy, MIXED proximity gate, atomic pre-cap filtering, fail-closed, warnings, description) in playlist_service.py and strategies.py. PR 3 — anchor protection through dedupe/cap, internal context seam in recommendation_candidates.py, transport through playlist_workflow.py, and desktop wiring with a combined-only dispatch guard."
  - "Slice 2 IMPLEMENTED (2026-08-03) on fix/same-color-energy-strict-eligibility (base test/same-color-energy-characterization, feature-branch-chain). Phases 2/3/4 + Phase 7 verification. Production (playlist_service.py, strategies.py): MIXED_RGB_L1_MAX=0.08, MIXED_CENTROID_REL_MAX=0.15, MIXED_ROLLOFF_REL_MAX=0.15 named constants; _same_color_energy_eligible (exact energy + label equality for RGB, label+bounded RGB-L1/centroid/rolloff proximity gate for MIXED, fail-closed on missing/zero denominators); _resolve_same_color_energy_anchor (start-path -> first manual-prefix majority-color record -> first profiled record; locked controls never anchor); _apply_same_color_energy_filter (atomic pre-cap, controls preserved); _same_color_energy_warnings (recommend_playlist owns prerequisite/empty/shortage warnings, never widens). same_color_energy removed from _COLOR_FILTER_STRATEGIES and no longer carries energy_tolerance; shared _apply_color_filter same_color branch byte-unchanged."
  - "Slice 2 verification: pytest 1398 passed, pyright 0 errors, coverage 91.07% (floor 70), ruff check + format clean, release_gate_check exit 0. All nine slice-1 characterization tests still pass; the only changed assertions are same_color_energy-scoped (its OWN old +/-1 band and old description), which this change exists to replace. same_color / same_energy characterizations untouched."
  - "Slice 2 review budget: 540 changed lines (production 226, tests 314) vs 400-line budget — OVER by 140. Entire overage is strict-TDD test volume, not production sprawl (production is under budget at 226), consistent with the slice-1 forecast. Under ask-on-risk this was reported to the maintainer BEFORE opening the PR; PR not opened pending a size:exception decision or a test-split instruction. Anchor-path transport / dedupe-cap protection / desktop wiring remain deferred to slice 3 (out of slice-2 scope)."
  - "Repository convention note: the branch-pr skill in the registry does NOT apply to XfinAudio. It mandates an issue with status:approved, a type:* label, and a branch naming scheme none of this repo's merged PRs use. XfinAudio has no issue-linkage workflow (only non-audio-release-gates.yml and publish-to-pypi.yml) and its merged PRs carry no labels. The real convention is a conventional-commit title, a feat/fix/perf-style branch prefix, and a narrative body following .github/pull_request_template.md."
