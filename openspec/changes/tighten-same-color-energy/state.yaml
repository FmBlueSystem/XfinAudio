notes:
  - "Root cause (verified against source, not inferred): MIXED is not a spectral region. `_dominant_color()` (audio/spectral_profile.py:177-194) returns MIXED from its `if not eligible:` branch — the ELSE of three threshold tests (RED >= 0.45, GREEN >= 0.48, BLUE >= 0.22). Measured over the r+g+b=1 simplex, the MIXED bucket has an L1 diameter of 0.30 and covers only 2.21% of the simplex, yet holds 44% of the library's E8 tracks (305/691). The provisional bound MIXED_RGB_L1_MAX=0.08 is ~3.75x tighter than the bucket's own diameter, which is why label equality on MIXED constrains nothing."
  - "Second defect: `same_color_energy` composes two filters designed for OTHER strategies — `_apply_color_filter()` (label equality, built for same_color) and `_apply_energy_tolerance(tolerance=1)` (a sequencing-comfort band, built for same_energy). The two loosenesses are independent, so they multiply."
  - "Third defect: `_apply_color_filter()` (playlist_service.py:689-704) returns the UNFILTERED pool at line 703 when nothing matches. In the edge case the strategy offers no guarantee at all. The helper is SHARED with same_color, whose fallback and warning text must remain byte-compatible."
  - "Design gate history: three failed validations, then an authorized FOURTH correction (2026-08-02) that closed the architecture blocker and removed cross-artifact contradictions. design.md had asserted an invocation route the checkout does not have and declared `Open Questions: None` while CONTINUATION.md called the same gap the final known architecture blocker."
  - "Threshold decision (maintainer, 2026-08-02): MIXED numeric bounds are PROVISIONAL pending listening calibration, which cannot run before an implementation exists. The delta spec's MUST attaches to the RULE SHAPE (label equality plus a bounded anchor-relative RGB L1 / centroid / rolloff gate expressed through named constants), NOT to the literal values. Constants: MIXED_RGB_L1_MAX (initial 0.08), MIXED_CENTROID_REL_MAX (0.15), MIXED_ROLLOFF_REL_MAX (0.15)."
  - "Review Workload Forecast: ~558 changed lines total (~268 production, ~290 tests) against a 400-line budget. Over budget; the overage is strict-TDD test volume, not production sprawl. Maintainer chose chained PRs with feature-branch-chain."
  - "Tracker decision (maintainer, 2026-08-02): the inherited branch codex/fix-same-color-energy-semantics was REJECTED as tracker. It carried four unrelated commits (6543208, 787be59, 8e7643e, b71afa2 — VirtualDJ export plus energy shaping, ~1969 lines) absent from origin/main and from every remote branch. Chaining onto it would have merged VirtualDJ work into this change's final PR. Those commits retain their own delivery path on fix/impossible-key-clash-is-unavailable. Clean tracker feat/tighten-same-color-energy created from origin/main."
  - "Portability was verified on two axes before re-anchoring: semantically, the four commits touch playlist_service.py only in the recommend_playlist and _bpm_jump_warning regions — neither characterized function appears in that diff; textually, `git merge-tree --write-tree --merge-base=b71afa2 origin/main ec5947a` returned exit 0 with zero conflict markers."
