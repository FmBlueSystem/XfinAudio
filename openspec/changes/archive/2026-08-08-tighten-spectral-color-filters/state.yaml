  - "VERIFY phase complete (2026-08-08): verify-report.md written against main 4603d24 (1.7.6), verdict PASS. Six commands re-run independently: pytest 1510 passed (180 warnings, 52.21s), pyright 0 errors/0 warnings/0 informations, coverage 91.21% (floor 70), ruff check clean, ruff format 279 files already formatted, release_gate_check PASS (PyInstaller check-only; project-root build/ and dist/ absent). All 7 requirements across the two delta specs (same-color-strategy 3 ADDED + 1 MODIFIED; same-color-energy-strategy 2 MODIFIED + 1 ADDED, 18 scenarios total) trace to implementation and 18/18 have asserting tests. Findings: CRITICAL 0, WARNING 0, SUGGESTION 2."
  - "Verify-time discovery worth carrying: the helper names this change SHIPPED (_same_color_eligible / _apply_same_color_filter / _same_color_warnings, beside the predecessor's _same_color_energy_* trio) no longer exist on main. resolve-color-review-findings (PR #339, 201e001) unified both trios into ONE gate parameterized by the frozen _ColorGate dataclass: _color_eligible(anchor, candidate, match_energy=...), _apply_color_filter(..., gate=...), _color_filter_warnings(..., gate=...), with COLOR_FILTER_STRATEGIES = frozenset(_COLOR_GATES) as the single dispatch answer. The requirements are behavioural and all still hold; only the internal factoring moved. design.md and apply-progress.md keep the shipped-then names as historical record; verify-report.md is the bridge. Note the trap: _apply_color_filter exists AGAIN under its old name with a DIFFERENT contract (gate-parameterized, fails closed) -- it is not the label-only helper this change removed."
  - "CALIBRATION CLOSURE (2026-08-08): tasks 4.1 and 4.2, deferred at apply because no library was reachable, are now DONE. Read-only sweep over a scratch copy of the real library (~/.xfinaudio/xfinaudio.sqlite3 -> /tmp/xfin-calib/scratch.sqlite3; the live DB was NEVER opened): 10,367 tracks with metadata_status='complete' and a non-null spectral profile (10,392 total), 40 anchors per dominant-color label, seed 20260808, BOTH same_color and same_color_energy pools, across MIXED/RED/GREEN/BLUE. Ran as a direct sweep over the pure predicate rather than an offscreen MainWindow: the gate is a pure function of cached profile values, so this measures exactly what a UI run would, with no Qt surface and no write path. OUTCOME: COLOR_RGB_L1_MAX=0.08, COLOR_CENTROID_REL_MAX=0.15, COLOR_ROLLOFF_REL_MAX=0.15 RETAINED UNCHANGED -- zero production source change."
  - "Calibration findings: (1) no pool collapse -- median same_color pools MIXED 725 / GREEN 522 / BLUE 258 / RED 152, and 1 of 160 sampled anchors produced an empty same_color pool. (2) RGB L1 is the BINDING axis for every colour: 18-34% of the label-equal base pool passes L1 alone against 44-81% for centroid and rolloff, and dropping L1 multiplies every pool 3-4x while dropping either relative-delta axis barely moves it. (3) The two relative-delta bounds at 0.15 are near-saturated -- raising either to 0.50 changes the pool under 6% in every colour -- so they are a cheap backstop against spectral outliers, not the primary filter; lowering them to 0.10 WOULD bite (~15-20%), so 0.15 sits just past the saturation knee. (4) RED is intrinsically thin (979 tracks vs 3342 MIXED), so short RED sets are an honest library property, not a gate defect. (5) The three anchors with pool <= 2 are spectral outliers (centroid 3398-5626 Hz and rolloff 6931-9078 Hz against library-typical ~1300/~2400 Hz); the gate fails closed CORRECTLY for them because no neighbours exist in that spectral region."
  - "Calibration scope limit recorded honestly: this is a POOL-GEOMETRY measurement, not a listening test. The maintainer signed off on the measured evidence without a separate listening pass. Stated plainly rather than letting 'calibration closed' imply a listening test that never happened."
  - "Method note for future calibrations: measuring 'percentage passing each axis ALONE' together with 'pool size if this axis is DROPPED' identifies the binding constraint reliably; single-anchor spot checks do not. An earlier narrower measurement had misidentified GREEN as centroid/rolloff-bound when it is in fact L1-bound like every other colour."
  - "Calibration scripts live in /tmp/xfin-calib/ and are deliberately NOT added to the repo: the declared post-calibration change surface is constants plus artifacts only, and the outcome is that the constants do not change."
  - "ARCHIVE 2026-08-08: artifacts moved to openspec/changes/archive/2026-08-08-tighten-spectral-color-filters/ via git mv (history preserved). archive-report.md written. No spec.md at the archive root: this change carries TWO capability deltas, and the repo convention for multi-capability archives (2026-07-20-strategy-ux-clarity-and-dedupe, qa-manual-mik-evidence, xfinaudio-audio-preview) is specs/<capability>/spec.md only. SPEC SYNC DONE -- this pays the spec_synced:false debt carried by 2026-08-07-resolve-color-review-findings and 2026-08-08-prep-copilot-color-anchor, both of which named this change as the place to fold the durable behaviour in. Order applied: predecessor tighten-same-color-energy FIRST, then this change on top (it is the successor and overrides). openspec/specs/same-color-energy-strategy/spec.md REWRITTEN to current shipped behaviour under the COLOR_* names; openspec/specs/same-color-strategy/spec.md CREATED from this change's delta."
  - "Spec-sync adaptations, disclosed rather than silent (delta text was carried VERBATIM everywhere else). (1) In openspec/specs/same-color-energy-strategy/spec.md the durable requirement 'Existing Strategies Are Unaffected' was REPLACED by this change's ADDED 'Untouched Sibling Strategies': the old one asserted 'same_color output is unchanged', which is now FALSE -- same_color's output deliberately changed and is governed by the new same-color-strategy capability. (2) All '(Previously: ...)' delta annotations were stripped; durable specs in this repo carry none. (3) Two 'before and after this change' scenario phrasings were rewritten to steady-state equivalents ('exactly what they were before the bounded colour gate existed'), because a durable spec has no 'this change'. (4) 'except where a separate delta for same_color modifies it' became 'and same_color's is governed by the same-color-strategy capability'. (5) The predecessor's 'Locked controls do not determine anchor' and 'Strict pool is shorter than requested' scenarios were CARRIED FORWARD onto the successor's overriding requirement bodies, because both are shipped, tested behaviour (_resolve_color_anchor skips locked paths; _color_filter_warnings emits the shortage warning under gate.reports_shortage). (6) openspec/specs/same-color-strategy/spec.md gained one scenario NOT present in the delta -- 'Missing anchor prerequisite fails closed' -- because the prerequisite branch is shipped, warned and tested (test_same_color_prerequisite_warning_is_emitted_without_generated_candidates, test_same_color_skips_filter_when_no_track_has_a_profile) and a durable spec that omitted it would under-describe the capability."
