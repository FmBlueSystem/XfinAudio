  - "Artifacts authored RETROACTIVELY on 2026-08-08 from the merged commit 201e001 (branch commit f7dd244, PR #339). AGENTS.md requires durable openspec/ artifacts for every non-trivial change and the PR shipped without them. Same precedent as 2026-07-18-recommendation-scoring-correctness-fixes. They record the change; they did not steer it, so there is no RED-first TDD ledger."
