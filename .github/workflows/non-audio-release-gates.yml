name: Non-audio release gates

on:
  workflow_dispatch:
    inputs:
      include_packaging_build:
        description: "Run the optional temp PyInstaller packaging build gate"
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  non-audio-release-gates:
    name: Non-audio release gates
    runs-on: macos-latest
    # The suite imports Qt while collecting. A headless runner with no platform
    # hint is where two jobs stalled to the 20-minute timeout without emitting
    # a single line of output.
    env:
      QT_QPA_PLATFORM: offscreen
    # Successful runs take 2-3 minutes. Without a limit a hung job runs to the
    # 6-hour default, and macOS runner minutes bill at 10x the Linux rate.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The version lives only in pyproject.toml and names the packaged file.
      # Left alone it drifts silently: v1.0.2 was tagged six weeks and 265
      # commits before anyone noticed the package still claimed to be that
      # release, so two files with the same name held different builds.
      - name: Require a version bump
        if: github.event_name == 'pull_request'
        run: |
          read_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="$(git show FETCH_HEAD:pyproject.toml | read_version)"
          head="$(read_version < pyproject.toml)"
          if [[ -z "${base}" || -z "${head}" ]]; then
            echo "error: could not read the version from pyproject.toml" >&2
            exit 1
          fi
          if [[ "${base}" == "${head}" ]]; then
            echo "error: pyproject.toml is still ${head}; bump it before merging." >&2
            exit 1
          fi
          # A bump is two files: uv.lock pins the project's own version as well,
          # so `uv lock` has to run after it. No check for that here -- the
          # `uv sync --locked` step below already fails on the mismatch and its
          # message names the fix.
          echo "version ${base} -> ${head}"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run type checker
        run: uv run pyright src tests

      - name: Prepare release evidence directory
        run: mkdir -p .release-evidence

      - name: Run optional packaging release gates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_packaging_build }}
        run: >-
          uv run python scripts/release_gate_check.py
          --include-packaging-build
          --report-json .release-evidence/release-gate-report.json

      - name: Run default non-audio release gates
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.include_packaging_build }}
        run: >-
          uv run python scripts/release_gate_check.py --run
          --report-json .release-evidence/release-gate-report.json

      - name: Render non-audio release gate Markdown evidence
        if: always()
        run: >-
          uv run python scripts/render_release_gate_evidence.py
          .release-evidence/release-gate-report.json
          --output .release-evidence/release-gate-evidence.md

      - name: Append non-audio release gate evidence to step summary
        if: always()
        run: cat .release-evidence/release-gate-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-audio release gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: non-audio-release-gate-evidence
          path: |
            .release-evidence/release-gate-report.json
            .release-evidence/release-gate-evidence.md
          if-no-files-found: error
