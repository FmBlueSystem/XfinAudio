name: Non-audio release gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  non-audio-release-gates:
    name: Non-audio release gates
    runs-on: macos-latest
    # Bound the complete fresh-process manifest instead of allowing a hung
    # coverage batch to consume the 6-hour default on a macOS runner.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The version lives only in pyproject.toml and names the packaged file.
      # Left alone it drifts silently: v1.0.2 was tagged six weeks and 265
      # commits before anyone noticed the package still claimed to be that
      # release, so two files with the same name held different builds.
      - name: Require a version bump
        if: github.event_name == 'pull_request'
        run: |
          read_version() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="$(git show FETCH_HEAD:pyproject.toml | read_version)"
          head="$(read_version < pyproject.toml)"
          if [[ -z "${base}" || -z "${head}" ]]; then
            echo "error: could not read the version from pyproject.toml" >&2
            exit 1
          fi
          if [[ "${base}" == "${head}" ]]; then
            echo "error: pyproject.toml is still ${head}; bump it before merging." >&2
            exit 1
          fi
          # A bump is two files: uv.lock pins the project's own version as well,
          # so `uv lock` has to run after it. No check for that here -- the
          # `uv sync --locked` step below already fails on the mismatch and its
          # message names the fix.
          echo "version ${base} -> ${head}"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ensure FFmpeg integration prerequisite
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version

      - name: Run type checker
        run: uv run pyright src tests

      - name: Prepare release evidence directory
        run: mkdir -p .release-evidence

      - name: Run default non-audio release gates
        run: >-
          uv run python scripts/release_gate_check.py --run
          --coverage-batch-size 120
          --coverage-evidence-dir "${{ runner.temp }}/coverage-evidence"
          --report-json .release-evidence/release-gate-report.json

      - name: Render non-audio release gate Markdown evidence
        if: always()
        run: >-
          uv run python scripts/render_release_gate_evidence.py
          .release-evidence/release-gate-report.json
          --output .release-evidence/release-gate-evidence.md

      - name: Append non-audio release gate evidence to step summary
        if: always()
        run: cat .release-evidence/release-gate-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-audio release gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: non-audio-release-gate-evidence
          include-hidden-files: true
          path: |
            .release-evidence/release-gate-report.json
            .release-evidence/release-gate-evidence.md
            ${{ runner.temp }}/coverage-evidence/
          if-no-files-found: error

  electron-migration-tests:
    name: Electron migration tests
    runs-on: macos-latest
    # Independent of legacy gate success; the suite itself is bounded at 10m.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install separate locked Qt-free Python dependencies
        run: |
          uv venv "${{ runner.temp }}/electron-python" --python 3.12
          uv pip sync --python "${{ runner.temp }}/electron-python/bin/python" \
            --require-hashes --index-url https://pypi.org/simple desktop-electron/requirements-headless.txt

      - name: Install locked Electron dependencies
        working-directory: desktop-electron
        run: npm ci --registry=https://registry.npmjs.org

      - name: Ensure FFmpeg integration prerequisite
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version

      - name: Run Electron suite with zero-skip evidence
        id: electron-tests
        env:
          XFIN_PYTHON: ${{ runner.temp }}/electron-python/bin/python
        run: '"$XFIN_PYTHON" scripts/electron_ci_check.py'

      - name: Record Electron stage outcome
        if: always()
        run: |
          mkdir -p .release-evidence
          echo "Electron test stage: ${{ steps.electron-tests.outcome }}" | tee .release-evidence/electron-stage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Electron test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-test-evidence
          include-hidden-files: true
          path: |
            .release-evidence/electron-test-report.json
            .release-evidence/electron-test.log
            .release-evidence/electron-stage.txt
          if-no-files-found: error
