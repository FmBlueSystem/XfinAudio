name: Publish to PyPI

# Disabled as a release channel (2026-09-29): XfinAudio is distributed as the
# macOS DMG only, and PyPI publishing has actually been broken since v1.0.2
# (expired PYPI_API_TOKEN secret, then 403s) without anyone missing it.
# Kept manual-only so the fully gated publish path stays tested and returns
# by restoring the tag trigger below.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: macos-latest
    # Must match the environment configured on the PyPI trusted publisher.
    environment: pypi
    # Same reasoning as the release gates: bound the job so a hung publish
    # cannot burn six hours of macOS runner time.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      # The tag names the release and pyproject names the build. They drifted
      # once: v1.0.2 sat six weeks and 265 commits ahead of the version it
      # published, so two files with the same name held different builds.
      - name: Require the tag to match the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Read the version with a real TOML parser. `sed | head -1` matched the
          # first `version = "..."` at column zero, so any earlier table's own
          # version (TOML does not require indentation) won and the empty guard
          # only noticed a total miss, never the wrong table.
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb")).get("project", {}).get("version", ""))')"
          if [[ -z "${version}" ]]; then
            echo "error: could not read the version from pyproject.toml" >&2
            exit 1
          fi
          if [[ "${tag}" != "${version}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match pyproject.toml ${version}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches ${version}"

      # The pull-request workflow gates the suite, the type checker, the lint,
      # the coverage floor and every hygiene check. Publishing used to run only
      # the suite, so the one path with no reviewer had the least scrutiny.
      # `--run` executes the suite once; there is no separate test step.
      - name: Run non-audio release gates
        run: >-
          uv run python scripts/release_gate_check.py --run
          --report-json .release-evidence/release-gate-report.json

      # The gate writes structured evidence into .release-evidence/. Nothing
      # else preserves it, so without this the report died with the runner on
      # exactly the red run that needed it.
      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-release-gate-evidence
          path: .release-evidence/release-gate-report.json
          if-no-files-found: error

      - name: Build package
        run: uv build

      # Publishes via PyPI trusted publishing (OIDC): the job's id-token
      # permission plus the publisher registered on pypi.org authorize the
      # upload, so no API token exists to expire (the PYPI_API_TOKEN secret
      # silently broke every publish since v1.0.2 with 403s).
      - name: Publish to PyPI
        run: uv publish
