[project]
name = "xfinaudio"
version = "1.8.2"
description = "Metadata-driven DJ playlist assistant discovery prototype."
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47,<2.0",
    "pydantic>=2.0,<3.0",
    "PySide6>=6.0,<7.0",
    "pyobjc-framework-Cocoa>=10.0,<13.0; platform_system == 'Darwin'",
    "setproctitle>=1.3,<2.0",
    "librosa>=0.10,<0.12",
    "numpy>=1.24,<3.0",
    "watchdog>=4.0,<7.0",
]

[project.scripts]
xfinaudio = "xfinaudio.desktop.app:main"

[dependency-groups]
dev = [
    "packaging>=24.0,<26.0",
    "pyinstaller==6.20.0",
    "pyloudnorm>=0.1.1,<0.2",
    "pyright>=1.1.410,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The whole suite runs in well under a minute; a single test past 120s is
# hung, not slow. Twice CI has burned the full 20-minute job timeout with no
# indication of which test stalled -- this dumps every thread's traceback, so
# the next occurrence names the culprit instead of leaving a cancelled job.
# Built into pytest via the stdlib faulthandler; it reports and lets the run
# continue rather than killing it.
faulthandler_timeout = "120"
markers = ["uses_spectral_completion_worker: exercise the real controller start boundary"]
# Third-party noise, not ours. The first librosa decode imports
# librosa.core.audio, which runs a top-level `import audioread`
# (librosa/core/audio.py:11); audioread.rawread then imports these stdlib
# modules, all deprecated for removal in Python 3.13. Unfixable until librosa
# 1.0 drops audioread. Each message is a literal prefix, escaped by pytest.
filterwarnings = [
  # Third-party, emitted by librosa 0.11's top-level `import audioread`
  # (librosa/core/audio.py:11); disappears with librosa 1.0.
  "ignore:'aifc' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
  # Third-party, emitted by librosa 0.11's top-level `import audioread`
  # (librosa/core/audio.py:11); disappears with librosa 1.0.
  "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
  # Third-party, emitted by librosa 0.11's top-level `import audioread`
  # (librosa/core/audio.py:11); disappears with librosa 1.0.
  "ignore:'sunau' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = [".venv", "build", "dist", "node_modules", ".ruff_cache", ".pytest_cache"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportPrivateImportUsage = false
reportOptionalMemberAccess = false
reportCallIssue = false
reportAttributeAccessIssue = false

[tool.coverage.run]
source = ["src/xfinaudio"]
branch = false

[tool.coverage.report]
# 89, not 70: the suite measured 91.64% on this tree, so a 70 floor could absorb
# a twenty-point collapse of the test suite before anyone noticed. The slack is
# deliberate headroom for ordinary churn, not a number to shave.
fail_under = 89
precision = 2
show_missing = true
skip_empty = true
omit = ["*/tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
extend-per-file-ignores = { "scripts/fill_spanish_translations.py" = ["E501", "F601"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src/xfinaudio"]

# Planning and review scratch stays in git but out of the distribution. Without
# this the published sdist shipped PLAN.md, the PLAN-REVIEW-LOG files and every
# document under docs/reviews/.
[tool.hatch.build.targets.sdist]
exclude = [
  "/PLAN*.md",
  "/SPEC-*.md",
  "/docs/reviews",
  "/docs/superpowers",
  "/odd",
]
